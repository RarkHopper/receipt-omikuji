[project]
name = "receipt-omikuji"
version = "1.0.0"
description = "一文字ずつ印刷するレシートおみくじ"
requires-python = ">=3.12"
dependencies = ["pillow>=12.0,<13", "pyusb>=1.3,<2"]

[project.scripts]
receipt-omikuji = "receipt_omikuji.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["getgauge==0.5.1", "ruff==0.16.10", "mypy>=1.18,<2"]

[tool.mypy]
python_version = "3.12"
strict = true
cache_dir = "build/mypy-cache"
files = ["src/receipt_omikuji"]

[[tool.mypy.overrides]]
module = ["usb.*"]
ignore_missing_imports = true
