<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>カスのおみくじ · 紙の先を見てください</title>
<style>
:root{color-scheme:light;--ink:#2e2621;--accent:#a8442f}
*{box-sizing:border-box}body{margin:0;background:#ddd9d1;color:var(--ink);font:15px system-ui,sans-serif}
main{max-width:900px;margin:auto;padding:40px 24px}h1{font-size:32px;letter-spacing:.06em;margin:0 0 12px}
p{line-height:1.8}.intro{color:#655c53}.control{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}
button{border:1px solid #77695c;padding:10px 16px;border-radius:5px;background:#f8f4ec;color:var(--ink);cursor:pointer}
button:first-child{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.4;cursor:default}
.machine{background:#302d2a;border-radius:12px;padding:12px 16px;box-shadow:0 7px 18px #0002}
.label{color:#d4cabd;font-size:12px;letter-spacing:.15em;margin:0 0 8px;display:flex;justify-content:space-between}
.view{height:440px;overflow:auto;overscroll-behavior:contain;background:#4a4641;scrollbar-color:#ab9c8c #4a4641}
.paper{background:#fffdf4;width:fit-content;min-width:310px;max-width:100%;margin:0 auto;min-height:100%;padding:24px 18px 0;box-shadow:4px 0 10px #0002}
#text{margin:0;font:17px/1.85 "Hiragino Kaku Gothic ProN","Noto Sans CJK JP",monospace;white-space:pre;letter-spacing:0}
.edge{border-bottom:2px dashed #c3bda9;padding-top:14px;position:relative}.edge:after{content:"いま印字された端";display:block;text-align:right;font:10px system-ui;color:#978d7e;padding:4px}
#status{min-height:1.8em;margin-bottom:12px;font-variant-numeric:tabular-nums}.meta{font-size:12px;color:#695e52;margin-top:20px}
.vertical .paper{width:var(--receipt-width);min-width:0;padding:0 10px;background:#fffdf4}
.vertical #text{white-space:normal;font-family:"Hiragino Mincho ProN","Arial Unicode MS",serif}
.receipt-glyph{writing-mode:vertical-rl;text-orientation:mixed;display:block;width:1em;height:1em;line-height:1}
.receipt-row{--frame-scale:1;border-left:calc(7px * var(--frame-scale)) double #2e2621;border-right:calc(7px * var(--frame-scale)) double #2e2621;display:flex;align-items:center;justify-content:center;line-height:1;overflow:hidden}
.receipt-row.header{border-top:calc(7px * var(--frame-scale)) double #2e2621;flex-direction:column;gap:calc(8px * var(--frame-scale));font-size:calc(24px * var(--frame-scale))!important;letter-spacing:.25em}
.receipt-row.header:before{content:"◇";font-size:calc(20px * var(--frame-scale));letter-spacing:0}
.receipt-row.footer{border-bottom:calc(7px * var(--frame-scale)) double #2e2621;font-size:calc(28px * var(--frame-scale))!important}
.receipt-row.feed{border:0}
.receipt-row.dot{font-size:calc(20px * var(--frame-scale))!important}.receipt-row.ellipsis{font-size:calc(18px * var(--frame-scale))!important;letter-spacing:2px}
@media(max-width:500px){main{padding:24px 12px}h1{font-size:25px}.machine{padding:10px 4px}.paper{padding-left:12px;padding-right:12px}#text{font-size:15px}}
@media print{body{background:white}.control,.intro,.label,.meta,#status{display:none}.machine{background:none;box-shadow:none;padding:0}.view{height:auto;overflow:visible;background:none}.paper{box-shadow:none;margin:0;min-height:0}.edge{display:none}}
</style>
<main>
  <h1>カスのおみくじ</h1>
  <p class="intro">あなたの運勢は、この紙の先に。<br>先端まで読んで、その次をお待ちください。</p>
  <div class="control"><button id="manual">Enterで進める</button><button id="advance" disabled>続行</button><button id="play">自動で引く</button><button id="instant">即時で全部見る</button><button id="cancel" disabled>取消</button><button id="reset">紙を戻してやり直す</button></div>
  <div id="status" role="status" aria-live="polite">まだ何も印字されていません。</div>
  <section class="machine"><div class="label"><span>RECEIPT PREVIEW</span><span>↓ 紙が伸びる方向</span></div><div class="view" id="view"><div class="paper"><div id="text" style="white-space:pre"></div><div class="edge"></div></div></div></section>
  <p class="meta" id="meta"></p>
  <p class="meta">この画面はローカルの予定を再生します。実機の速度、プリンターフォント、排出位置は機種の確認が必要です。結果は末尾の確定欄で読み取れます。</p>
</main>
<script>
const plan=__PLAN__;
const text=document.getElementById('text'),view=document.getElementById('view'),status=document.getElementById('status');
const play=document.getElementById('play'),instant=document.getElementById('instant'),cancel=document.getElementById('cancel');
const manual=document.getElementById('manual'),advance=document.getElementById('advance');
const vertical=plan.settings.layout==='vertical';
if(vertical){document.body.classList.add('vertical');document.documentElement.style.setProperty('--receipt-width',`${plan.settings.width_dots}px`);text.style.whiteSpace='normal'}
document.getElementById('meta').textContent=`seed ${plan.settings.seed} · 肩透かし${plan.rounds}回 · ${vertical?'文字'+plan.events.filter(event=>event.glyph).length+'字':'紙'+plan.paper_lines+'行'} · 予定の待ち${(plan.wait_ms/1000).toFixed(1)}秒`;
let timer=null,index=0,generation=0,running=false,paused=false,lines=0,resume=null;
function controls(){play.disabled=manual.disabled=instant.disabled=running||index>0;cancel.disabled=!running;advance.disabled=!paused}
function stop(){generation++;clearTimeout(timer);timer=null;running=paused=false;resume=null;controls()}
function reset(){stop();index=0;lines=0;text.textContent='';status.textContent='まだ何も印字されていません。';controls()}
function print(event){
  if(!vertical){text.textContent+=event.text+'\n'+'\n'.repeat(event.blank_lines);return}
  const row=document.createElement('div');row.className='receipt-row';
  const scale=Math.min(1,view.clientWidth/plan.settings.width_dots);
  row.style.setProperty('--frame-scale',scale);
  row.style.height=`${event.lines*32*scale}px`;row.style.fontSize=`${plan.settings.width_dots*.5*scale}px`;
  if(event.decoration){row.classList.add(event.decoration);row.textContent=event.decoration==='header'?'御神籤':event.decoration==='footer'?'◇':''}
  else if(event.text==='…'){row.classList.add('ellipsis');row.textContent='・\n・\n・';row.style.whiteSpace='pre';row.style.lineHeight='1.1'}
  else if(event.text==='.'){row.classList.add('dot');row.textContent='・'}
  else{const glyph=document.createElement('span');glyph.className='receipt-glyph';glyph.textContent=event.text;row.append(glyph)}
  text.append(row);
}
function proceed(){if(!paused||!resume)return;paused=false;controls();const next=resume;resume=null;next()}
function start(mode){if(running||index>0)return;running=true;controls();const own=++generation;
  function next(){if(!running||generation!==own)return;
    while(index<plan.events.length){const event=plan.events[index++];
      if(event.type==='wait'){
        if(mode==='manual'&&(event.checkpoint??true)){paused=true;resume=next;status.textContent='停止中。Enterまたは続行ボタンで続きを出します。';controls();return}
        if(mode!=='instant'&&event.ms>0){status.textContent='この先をお待ちください…';timer=setTimeout(next,event.ms);return}continue
      }
      print(event);lines+=event.lines;view.scrollTop=view.scrollHeight;
      status.textContent=vertical?'次の文字は……':`紙${lines}行。次の文字は……`;
    }running=false;controls();
    status.textContent='運勢が確定しました。';
  }next();
}
manual.addEventListener('click',()=>start('manual'));advance.addEventListener('click',proceed);
document.addEventListener('keydown',event=>{if(event.key==='Enter'&&paused){event.preventDefault();if(!event.repeat)proceed()}});
play.addEventListener('click',()=>start('auto'));instant.addEventListener('click',()=>start('instant'));
cancel.addEventListener('click',()=>{stop();status.textContent='取り消しました。この後の印字は止まります。'});
document.getElementById('reset').addEventListener('click',reset);
</script>
</html>
